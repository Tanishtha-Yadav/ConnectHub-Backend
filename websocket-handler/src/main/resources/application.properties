spring.application.name=websocket-handler
server.port=8085

# Import secrets
spring.config.import=optional:classpath:application-secret.properties

# Eureka — register with service discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Redis — used for presence tracking and pub/sub
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT — must match auth-service exactly
jwt.expiration=86400000

# Room Service URL — used for membership verification before broadcasting
# For local dev: http://localhost:8082
# For Docker: override with ROOM_SERVICE_URL=http://room-service:8082 in docker-compose.yml
room-service.url=${ROOM_SERVICE_URL:http://localhost:8082}

# Presence Service URL — used by WebSocket connect/disconnect listener
# For local dev: http://localhost:8088
# For Docker: override with PRESENCE_SERVICE_URL=http://presence-service:8088
presence-service.url=${PRESENCE_SERVICE_URL:http://localhost:8088}

# Message Service — delivery/read persistence from WebSocket receipts
MESSAGE_SERVICE_URL=${MESSAGE_SERVICE_URL:http://localhost:8083}

# Logging
logging.level.root=INFO
logging.level.com.connecthub=DEBUG
logging.level.org.springframework.web.socket=DEBUG

# Actuator
management.server.port=9005
