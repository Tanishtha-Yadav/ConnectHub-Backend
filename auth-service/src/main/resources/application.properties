spring.application.name=auth-service
server.port=8081
server.servlet.context-path=/

# Import secrets from application-secret.properties (file is git-ignored)
spring.config.import=optional:classpath:application-secret.properties

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${server.port}

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/connecthub_auth?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username and password are in application-secret.properties

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=false

# JWT Configuration — actual secret is in application-secret.properties
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Logging Configuration
logging.level.root=INFO
logging.level.com.connecthub=DEBUG
logging.level.org.springframework.security=INFO

# Google OAuth2 Configuration
# Credentials (client-id, client-secret) are in application-secret.properties
spring.security.oauth2.client.registration.google.scope=openid,email,profile
# spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8081/api/auth/oauth2/google/callback
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo

# Swagger / OpenAPI
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Expose actuator endpoints on the same port used by Docker health checks.
management.server.port=${MANAGEMENT_SERVER_PORT:${server.port}}
