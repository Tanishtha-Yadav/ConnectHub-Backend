spring.application.name=media-service
server.port=8087

spring.config.import=optional:classpath:application-secret.properties

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}

# AWS S3
aws.s3.region=ap-south-1
aws.s3.bucket=tanishtha-connecthub-media

# Local storage fallback (used when AWS credentials are absent)
media.upload-dir=${MEDIA_UPLOAD_DIR:/uploads}
media.base-url=${MEDIA_BASE_URL:http://localhost:8080}

# File upload limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# JWT
jwt.secret=ConnectHub_JWT_Secret_Key_2026!@#$%^&*_SuperSecure_abcdefghijklmnopqrstuvwxyz_ABCDEF
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.connecthub=DEBUG
