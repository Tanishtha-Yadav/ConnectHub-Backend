spring.application.name=message-service
server.port=8083

# Import secrets from application-secret.properties (file is git-ignored)
spring.config.import=optional:classpath:application-secret.properties

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${server.port}

# MySQL Database Configuration (SEPARATE DB SERVER from auth-service)
# Point this to your dedicated message-service database host
spring.datasource.url=jdbc:mysql://localhost:3306/connecthub_messages?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username and password are in application-secret.properties

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration — actual secret is in application-secret.properties
# Must match auth-service jwt.secret exactly
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Logging
logging.level.root=INFO
logging.level.com.connecthub=DEBUG

# Swagger / OpenAPI
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.server.port=9003

# Room Service URL
room-service.url=${ROOM_SERVICE_URL:http://localhost:8082}
