spring.application.name=notification-service
server.port=8086

spring.config.import=optional:classpath:application-secret.properties

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/connecthub_notifications?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Email (SMTP) — configure in application-secret.properties
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.connecthub=DEBUG

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
